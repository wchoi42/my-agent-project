<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Moon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  color: #e8dcc8;
  font-family: Georgia, 'Times New Roman', serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
#game-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
canvas {
  display: block;
  border: 2px solid #2a2a3a;
  border-radius: 4px;
  cursor: crosshair;
  margin-top: 10px;
}
#hud {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 800px;
  padding: 10px 4px;
  font-size: 18px;
  letter-spacing: 1px;
}
.hud-item { opacity: 0.9; }
#title-bar {
  font-size: 28px;
  letter-spacing: 4px;
  padding: 12px 0 0 0;
  text-transform: uppercase;
  color: #f5e6c8;
  text-shadow: 0 0 20px rgba(245,230,200,0.3);
}
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,26,0.85);
  z-index: 10;
  pointer-events: auto;
}
#overlay.hidden { display: none; }
#overlay h2 {
  font-size: 32px;
  letter-spacing: 3px;
  margin-bottom: 16px;
  color: #f5e6c8;
}
#overlay p {
  font-size: 16px;
  line-height: 1.6;
  max-width: 500px;
  text-align: center;
  margin-bottom: 8px;
}
#overlay .final-score {
  font-size: 48px;
  color: #f0c866;
  margin: 12px 0;
}
#score-form {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  align-items: center;
}
#score-form input {
  background: #1a1a2e;
  border: 1px solid #3a3a5a;
  color: #e8dcc8;
  padding: 8px 12px;
  font-size: 16px;
  font-family: Georgia, serif;
  border-radius: 4px;
  width: 180px;
}
#score-form input:focus {
  outline: none;
  border-color: #f0c866;
}
button {
  background: #2a2a4a;
  color: #f5e6c8;
  border: 1px solid #4a4a6a;
  padding: 8px 20px;
  font-size: 16px;
  font-family: Georgia, serif;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 1px;
}
button:hover { background: #3a3a5a; }
button:disabled { opacity: 0.5; cursor: default; }
#high-scores {
  margin-top: 16px;
  text-align: center;
}
#high-scores h3 {
  font-size: 18px;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
#high-scores table {
  border-collapse: collapse;
  margin: 0 auto;
}
#high-scores td {
  padding: 3px 12px;
  font-size: 14px;
  opacity: 0.85;
}
#high-scores td:nth-child(2) {
  text-align: right;
  color: #f0c866;
}
#save-msg {
  font-size: 14px;
  min-height: 20px;
  margin-top: 4px;
  color: #e07070;
}
#save-msg.success { color: #70c070; }
#instructions {
  font-size: 13px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: center;
}
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="title-bar">Paper Moon</div>
  <div id="hud">
    <span class="hud-item">Shots: <span id="hud-shots">7</span></span>
    <span class="hud-item">Score: <span id="hud-score">0</span></span>
  </div>
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="instructions">Click to launch a paper star at the moon. Aim true.</div>

  <div id="overlay">
    <h2 id="overlay-title">Paper Moon</h2>
    <p id="overlay-desc">Launch paper stars at the drifting moon.<br>
    The closer to the center you hit, the more points you earn.<br>
    You have <strong>7 shots</strong>. Make them count.</p>
    <button id="btn-start">Begin</button>
    <div id="end-panel" style="display:none">
      <div class="final-score" id="final-score">0</div>
      <div id="score-form">
        <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
        <button id="btn-save" type="button">Save</button>
      </div>
      <div id="save-msg"></div>
      <button id="btn-restart">Play Again</button>
    </div>
    <div id="high-scores"></div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const hudShots = document.getElementById('hud-shots');
  const hudScore = document.getElementById('hud-score');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayDesc = document.getElementById('overlay-desc');
  const btnStart = document.getElementById('btn-start');
  const endPanel = document.getElementById('end-panel');
  const finalScoreEl = document.getElementById('final-score');
  const nameInput = document.getElementById('name-input');
  const btnSave = document.getElementById('btn-save');
  const btnRestart = document.getElementById('btn-restart');
  const saveMsg = document.getElementById('save-msg');
  const highScoresDiv = document.getElementById('high-scores');

  const MAX_SHOTS = 7;
  const MOON_RADIUS = 40;
  const STAR_SPEED = 18;
  const MAX_SCORE_PER_SHOT = 150;

  let state = 'menu';
  let shots = MAX_SHOTS;
  let score = 0;
  let moonX, moonY, moonVX, moonVY;
  let stars = [];
  let particles = [];
  let hitFlash = 0;
  let bgStars = [];
  let paperLayers = [];
  let saving = false;

  function initBgStars() {
    bgStars = [];
    for (let i = 0; i < 60; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        r: Math.random() * 1.5 + 0.5,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.01
      });
    }
  }

  function initPaperLayers() {
    paperLayers = [];
    for (let layer = 0; layer < 3; layer++) {
      const hills = [];
      const segments = 10 + layer * 4;
      for (let i = 0; i <= segments; i++) {
        hills.push({
          x: (i / segments) * W,
          y: H - 40 - layer * 30 + Math.sin(i * 0.8 + layer) * (15 + layer * 10)
        });
      }
      paperLayers.push({ hills, alpha: 0.15 + layer * 0.1, color: layer === 0 ? '#1a1a3e' : layer === 1 ? '#151530' : '#101025' });
    }
  }

  function resetMoon() {
    moonX = W * 0.3 + Math.random() * W * 0.4;
    moonY = 80 + Math.random() * 100;
    moonVX = (Math.random() - 0.5) * 0.8;
    moonVY = (Math.random() - 0.5) * 0.3;
  }

  function startGame() {
    state = 'playing';
    shots = MAX_SHOTS;
    score = 0;
    stars = [];
    particles = [];
    hitFlash = 0;
    saving = false;
    resetMoon();
    overlay.classList.add('hidden');
    updateHud();
  }

  function endGame() {
    state = 'ended';
    overlayTitle.textContent = 'Round Over';
    overlayDesc.innerHTML = 'Your score: the sum of accuracy across ' + MAX_SHOTS + ' shots.';
    finalScoreEl.textContent = score;
    endPanel.style.display = 'block';
    btnStart.style.display = 'none';
    nameInput.value = '';
    btnSave.disabled = false;
    saveMsg.textContent = '';
    saveMsg.className = '';
    overlay.classList.remove('hidden');
    loadHighScores();
  }

  function updateHud() {
    hudShots.textContent = shots;
    hudScore.textContent = score;
  }

  function shoot(mx, my) {
    if (state !== 'playing' || shots <= 0) return;
    const rect = canvas.getBoundingClientRect();
    const cx = (mx - rect.left) * (W / rect.width);
    const cy = (my - rect.top) * (H / rect.height);

    const launchX = W / 2;
    const launchY = H - 30;
    const dx = cx - launchX;
    const dy = cy - launchY;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    stars.push({
      x: launchX, y: launchY,
      vx: (dx / dist) * STAR_SPEED,
      vy: (dy / dist) * STAR_SPEED,
      alive: true,
      age: 0,
      rotation: Math.random() * Math.PI * 2
    });
    shots--;
    updateHud();
  }

  function spawnParticles(x, y, points) {
    const count = points > 100 ? 20 : points > 50 ? 12 : 6;
    const hue = points > 100 ? '50' : points > 50 ? '40' : '30';
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.02 + 0.015,
        size: Math.random() * 4 + 2,
        hue
      });
    }
  }

  function update() {
    if (state !== 'playing') return;

    moonX += moonVX;
    moonY += moonVY;

    if (moonX < MOON_RADIUS + 20 || moonX > W - MOON_RADIUS - 20) moonVX *= -1;
    if (moonY < MOON_RADIUS + 20 || moonY > 250) moonVY *= -1;

    moonVX += (Math.random() - 0.5) * 0.05;
    moonVY += (Math.random() - 0.5) * 0.03;
    moonVX = Math.max(-1.0, Math.min(1.0, moonVX));
    moonVY = Math.max(-0.5, Math.min(0.5, moonVY));

    for (const s of stars) {
      if (!s.alive) continue;
      s.x += s.vx;
      s.y += s.vy;
      s.age++;
      s.rotation += 0.1;

      if (s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) {
        s.alive = false;
        if (shots === 0 && stars.every(st => !st.alive)) endGame();
        continue;
      }

      const dx = s.x - moonX;
      const dy = s.y - moonY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MOON_RADIUS + 8) {
        s.alive = false;
        const accuracy = 1 - Math.min(dist / MOON_RADIUS, 1);
        const points = Math.round(accuracy * MAX_SCORE_PER_SHOT);
        score += points;
        hitFlash = 15;
        spawnParticles(s.x, s.y, points);
        updateHud();
        if (shots === 0 && stars.every(st => !st.alive)) endGame();
      }
    }

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.03;
      p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);

    if (hitFlash > 0) hitFlash--;
  }

  function drawStar5(cx, cy, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = rot + (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const method = i === 0 ? 'moveTo' : 'lineTo';
      ctx[method](cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
    }
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    for (const s of bgStars) {
      s.twinkle += s.speed;
      const alpha = 0.3 + Math.sin(s.twinkle) * 0.3;
      ctx.fillStyle = `rgba(245,230,200,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const layer of paperLayers) {
      ctx.fillStyle = layer.color;
      ctx.globalAlpha = layer.alpha;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (const pt of layer.hills) ctx.lineTo(pt.x, pt.y);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    const glowR = MOON_RADIUS + (hitFlash > 0 ? 20 : 8);
    const glowAlpha = hitFlash > 0 ? 0.5 : 0.15;
    const moonGrad = ctx.createRadialGradient(moonX, moonY, MOON_RADIUS * 0.3, moonX, moonY, glowR);
    moonGrad.addColorStop(0, `rgba(245,230,180,${glowAlpha + 0.2})`);
    moonGrad.addColorStop(0.5, `rgba(240,200,100,${glowAlpha})`);
    moonGrad.addColorStop(1, 'rgba(240,200,100,0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(moonX, moonY, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hitFlash > 0 ? '#fff8e0' : '#f5e6c8';
    ctx.beginPath();
    ctx.arc(moonX, moonY, MOON_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8d8b0';
    ctx.beginPath();
    ctx.arc(moonX - 10, moonY - 8, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX + 14, moonY + 5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(moonX - 5, moonY + 12, 6, 0, Math.PI * 2);
    ctx.fill();

    if (hitFlash > 0) {
      ctx.strokeStyle = `rgba(240,200,100,${hitFlash / 15 * 0.6})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(moonX, moonY, MOON_RADIUS + 10 + (15 - hitFlash) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (const s of stars) {
      if (!s.alive) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.fillStyle = '#f0c866';
      ctx.strokeStyle = '#d4a830';
      ctx.lineWidth = 1;
      drawStar5(0, 0, 10, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    for (const p of particles) {
      ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.life})`;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }

    if (state === 'playing') {
      ctx.fillStyle = '#f0c866';
      ctx.globalAlpha = 0.6;
      drawStar5(W / 2, H - 30, 8, Date.now() / 500);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  async function loadHighScores() {
    try {
      const res = await fetch('api/scores');
      if (!res.ok) return;
      const data = await res.json();
      if (data.length === 0) {
        highScoresDiv.innerHTML = '<h3>High Scores</h3><p style="font-size:14px;opacity:0.6">No scores yet</p>';
        return;
      }
      let html = '<h3>High Scores</h3><table>';
      for (const row of data.slice(0, 10)) {
        html += `<tr><td>${escapeHtml(row.name)}</td><td>${row.score}</td></tr>`;
      }
      html += '</table>';
      highScoresDiv.innerHTML = html;
    } catch (e) {
      highScoresDiv.innerHTML = '';
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function saveScore() {
    if (saving) return;
    const name = nameInput.value.trim();
    if (!name) {
      saveMsg.textContent = 'Enter a name first.';
      saveMsg.className = '';
      return;
    }
    if (name.length > 20) {
      saveMsg.textContent = 'Name must be 20 characters or fewer.';
      saveMsg.className = '';
      return;
    }
    saving = true;
    btnSave.disabled = true;
    saveMsg.textContent = 'Saving...';
    saveMsg.className = '';
    try {
      const res = await fetch('api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'Save failed');
      }
      saveMsg.textContent = 'Saved!';
      saveMsg.className = 'success';
      btnSave.disabled = true;
      loadHighScores();
    } catch (e) {
      saveMsg.textContent = e.message;
      saveMsg.className = '';
      btnSave.disabled = false;
      saving = false;
    }
  }

  canvas.addEventListener('click', (e) => {
    if (state === 'playing') shoot(e.clientX, e.clientY);
  });

  btnStart.addEventListener('click', startGame);
  btnRestart.addEventListener('click', () => {
    endPanel.style.display = 'none';
    btnStart.style.display = 'inline-block';
    startGame();
  });
  btnSave.addEventListener('click', saveScore);

  document.getElementById('score-form').addEventListener('submit', (e) => {
    e.preventDefault();
    saveScore();
  });

  nameInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      saveScore();
    }
  });

  window.gameState = {
    get moonX() { return moonX; },
    get moonY() { return moonY; },
    get score() { return score; },
    get shots() { return shots; },
    get state() { return state; }
  };

  initBgStars();
  initPaperLayers();
  resetMoon();
  loadHighScores();
  gameLoop();
})();
</script>
</body>
</html>
